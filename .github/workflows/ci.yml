name: CI

on:
  push:
    branches:
      #   - master
      - feat/add-indexdb
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v1
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmmirror.com/'

      - name: Install Dependencies
        run: npm ci

      - name: run ci:lint check lint and prettier
        run: npm run ci:lint
